[theme]
base = "light"
primaryColor = "#274e13"
backgroundColor = "#f7f3ea"
secondaryBackgroundColor = "#ece4d3"
textColor = "#2e2b26"
linkColor = "#274e13"
linkUnderline = false
borderColor = "#ddd3bf"
showWidgetBorder = true
baseRadius = "10px"
buttonRadius = "999px"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
headingFontWeights = [700, 700, 600, 600, 600, 600]
greenColor = "#274e13"
orangeColor = "#b45f06"
redColor = "#595959"
chartCategoricalColors = ["#9E0142", "#D53E4F", "#F46D43", "#D9A21B", "#4E9A2A", "#3288BD", "#5E4FA2"]
dataframeHeaderBackgroundColor = "#d9ead3"
dataframeBorderColor = "#ddd3bf"

[theme.sidebar]
backgroundColor = "#ede5d4"
secondaryBackgroundColor = "#fbf8f1"
borderColor = "#d8ccb3"

[server]
enableStaticServing = true
runOnSave = false

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[browser]
gatherUsageStats = false
